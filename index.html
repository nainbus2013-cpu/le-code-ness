<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Le Code Ness</title>

<style>

body{
font-family:Arial,sans-serif;
background-image:url("https://images.unsplash.com/photo-1506744038136-46273834b3fb");
background-size:cover;
background-position:center;
background-attachment:fixed;
color:white;
text-align:center;
padding:40px;
min-height:100vh;
}


h1{
background:rgba(0,0,0,0.7);
padding:20px;
border-radius:20px;
display:inline-block;
}



#connexion{

background:rgba(0,0,0,0.7);
padding:30px;
border-radius:20px;
width:300px;
margin:auto;

}



input{

width:90%;
padding:15px;
margin:10px;
border-radius:10px;
border:none;
font-size:18px;

}



.login{

width:200px;
height:60px;
background:#00c6ff;
color:white;
border:none;
border-radius:15px;
font-size:20px;
cursor:pointer;

}



#site{
display:none;
}



.son{

width:200px;
height:200px;
margin:10px;
font-size:22px;
font-weight:bold;
border:none;
border-radius:20px;
cursor:pointer;
background:white;
color:black;

}



.son:hover{
transform:scale(1.08);
}



.playing{
background:limegreen;
color:white;
}



#adminBtn{

display:none;
position:fixed;
top:20px;
right:20px;
width:60px;
height:60px;
border-radius:50%;
background:red;
color:white;
font-size:25px;
z-index:999;

}



#adminPanel{

display:none;
position:fixed;
top:90px;
right:20px;
background:rgba(0,0,0,0.85);
padding:20px;
border-radius:15px;
z-index:999;

}



#adminPanel button{

width:170px;
height:45px;
margin:5px;
font-size:14px;

}



#lockBtn{

display:none;
position:fixed;
top:20px;
right:100px;
background:orange;
color:white;
border:none;
border-radius:15px;
height:60px;
width:170px;
z-index:999;

}



.bloque{

opacity:0.4;
pointer-events:none;

}


</style>

</head>


<body>



<div id="connexion">


<h1>🎵 Le Code Ness 🎵</h1>


<br>


<input id="identifiant" placeholder="Identifiant">


<input id="motdepasse" type="password" placeholder="Mot de passe">


<br>


<button class="login" onclick="connexion()">

Entrer

</button>


<p>Accès privé</p>


</div>





<div id="site">


<h1>🎵 Le Code Ness 🎵</h1>

<h2 id="bienvenue"></h2>



<button class="son" onclick="jouer(this,'https://ztroeabflzrbxhxewsrc.supabase.co/storage/v1/object/public/sons/ca-va-peter.mp3')">
sa va peter
</button>


<button class="son" onclick="jouer(this,'https://ztroeabflzrbxhxewsrc.supabase.co/storage/v1/object/public/sons/couscous-merguez.mp3')">
coucous mergez
</button>


<button class="son" onclick="jouer(this,'https://ztroeabflzrbxhxewsrc.supabase.co/storage/v1/object/public/sons/quoi-de-neuf-dans-ton-troue.mp3')">
ton trou
</button>


<button class="son" onclick="jouer(this,'https://ztroeabflzrbxhxewsrc.supabase.co/storage/v1/object/public/sons/vos-meres-cest-des-dinosaures-tk78%20(1).mp3')">
vos mere les dinozaures
</button>


<button class="son" onclick="jouer(this,'https://ztroeabflzrbxhxewsrc.supabase.co/storage/v1/object/public/sons/detecteur-de-mensonges-des-enfants-_-louna-ccvb-4.mp3')">
arracher les yeux
</button>


<button class="son" onclick="jouer(this,'https://ztroeabflzrbxhxewsrc.supabase.co/storage/v1/object/public/sons/caca_c_d_licieux_.mp3')">
caca delicieux
</button>



</div>




<button id="adminBtn" onclick="ouvrirAdmin()">⚙️</button>


<button id="lockBtn" onclick="changerVerrou()">
🔓 Déverrouiller
</button>



<div id="adminPanel">

<h3>Admin</h3>

<div id="listeAdmin"></div>

</div>






<script>


const comptes={

"administrateur":"Théoleroy2013*",

"barbancon":"kaboom08"

};



let siteVerrouille=false;




function connexion(){


let id=document.getElementById("identifiant").value;

let mdp=document.getElementById("motdepasse").value;



if(comptes[id] && comptes[id]===mdp){



if(siteVerrouille && id!=="administrateur"){

alert("🔧 Désolé, le site est en mise à jour. Contactez l'administrateur.");

return;

}



document.getElementById("connexion").style.display="none";

document.getElementById("site").style.display="block";



if(id==="administrateur"){


document.getElementById("adminBtn").style.display="block";

document.getElementById("lockBtn").style.display="block";

document.getElementById("bienvenue").innerHTML="👑 Bonjour admin !";


}

else{


document.getElementById("bienvenue").innerHTML="Bonjour "+id+" !";


}


}


else{

alert("Identifiant ou mot de passe incorrect");

}


}







let audioActuel=null;

let boutonActuel=null;



function jouer(bouton,url){


if(audioActuel){

audioActuel.pause();

audioActuel.currentTime=0;

}



if(boutonActuel){

boutonActuel.classList.remove("playing");

}



audioActuel=new Audio(url);

boutonActuel=bouton;


bouton.classList.add("playing");


audioActuel.play();


audioActuel.onended=()=>{

bouton.classList.remove("playing");

};


}







function ouvrirAdmin(){


let p=document.getElementById("adminPanel");


if(p.style.display==="block"){

p.style.display="none";

}

else{

p.style.display="block";

chargerAdmin();

}


}





function chargerAdmin(){


let liste=document.getElementById("listeAdmin");

liste.innerHTML="";


document.querySelectorAll(".son").forEach((bouton,index)=>{


let b=document.createElement("button");


b.innerHTML=bouton.classList.contains("bloque") ?
"Débloquer "+(index+1) :
"Bloquer "+(index+1);



b.onclick=()=>{


bouton.classList.toggle("bloque");


b.innerHTML=bouton.classList.contains("bloque") ?
"Débloquer "+(index+1) :
"Bloquer "+(index+1);


};



liste.appendChild(b);


});


}





function changerVerrou(){


siteVerrouille=!siteVerrouille;



if(siteVerrouille){

document.getElementById("lockBtn").innerHTML="🔒 Verrouillé";

alert("Site verrouillé");

}

else{

document.getElementById("lockBtn").innerHTML="🔓 Déverrouiller";

alert("Site déverrouillé");

}


}



</script>


</body>

</html>
