<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Le Code Ness</title>

<style>

body{
font-family:Arial,sans-serif;
background:url("https://images.unsplash.com/photo-1506744038136-46273834b3fb");
background-size:cover;
background-attachment:fixed;
color:white;
text-align:center;
padding:40px;
}


#connexion{
background:rgba(0,0,0,0.7);
padding:30px;
border-radius:20px;
width:300px;
margin:auto;
}


h1{
background:rgba(0,0,0,0.7);
padding:20px;
border-radius:20px;
display:inline-block;
}


input{
width:90%;
padding:15px;
margin:10px;
border-radius:10px;
border:none;
}


button{
cursor:pointer;
border:none;
border-radius:15px;
}


.login{
width:200px;
height:60px;
background:#00c6ff;
color:white;
font-size:20px;
}


#site{
display:none;
}


.son{
width:200px;
height:200px;
margin:10px;
font-size:22px;
background:white;
color:black;
}


.bloque{
opacity:0.4;
pointer-events:none;
}



#adminBtn{

display:none;
position:fixed;
top:20px;
right:20px;
width:65px;
height:65px;
border-radius:50%;
background:red;
color:white;
font-size:25px;

}



#adminMenu{

display:none;
position:fixed;
top:95px;
right:20px;
background:rgba(0,0,0,0.9);
padding:20px;
border-radius:15px;

}


#adminMenu button{

display:block;
width:220px;
margin:10px;
padding:15px;

}


</style>


</head>


<body>




<div id="connexion">


<h1>🎵 Le Code Ness 🎵</h1>


<input id="identifiant" placeholder="Identifiant">


<input id="motdepasse" type="password" placeholder="Mot de passe">


<br>


<button class="login" onclick="connexion()">
Entrer
</button>


</div>





<div id="site">


<h1>🎵 Le Code Ness 🎵</h1>


<h2 id="bienvenue"></h2>



<button class="son" onclick="jouer(this,'https://ztroeabflzrbxhxewsrc.supabase.co/storage/v1/object/public/sons/ca-va-peter.mp3')">
sa va peter
</button>



<button class="son" onclick="jouer(this,'https://ztroeabflzrbxhxewsrc.supabase.co/storage/v1/object/public/sons/couscous-merguez.mp3')">
coucous mergez
</button>



<button class="son" onclick="jouer(this,'https://ztroeabflzrbxhxewsrc.supabase.co/storage/v1/object/public/sons/quoi-de-neuf-dans-ton-troue.mp3')">
ton trou
</button>



<button class="son" onclick="jouer(this,'https://ztroeabflzrbxhxewsrc.supabase.co/storage/v1/object/public/sons/vos-meres-cest-des-dinosaures-tk78%20(1).mp3')">
vos mere les dinozaures
</button>



<button class="son" onclick="jouer(this,'https://ztroeabflzrbxhxewsrc.supabase.co/storage/v1/object/public/sons/detecteur-de-mensonges-des-enfants-_-louna-ccvb-4.mp3')">
arracher les yeux
</button>


</div>





<button id="adminBtn" onclick="ouvrirAdmin()">⚙️</button>



<div id="adminMenu">


<h3>Admin</h3>


<button onclick="verrouSite()">
🔒 Verrouiller / déverrouiller
</button>


<button onclick="bloquerSons()">
🔇 Bloquer / débloquer sons
</button>


<button onclick="gererUtilisateur()">
👤 Bloquer / débloquer utilisateur
</button>



</div>







<script>



const comptes={

"administrateur":"Théoleroy2013*",

"barbancon":"kaboom08"

};




let verrou =
localStorage.getItem("verrou")==="true";



let sonsBloques =
JSON.parse(localStorage.getItem("sonsBloques")) || [];



let usersBloques =
JSON.parse(localStorage.getItem("usersBloques")) || [];







function connexion(){


let id=document.getElementById("identifiant").value;

let mdp=document.getElementById("motdepasse").value;



if(!comptes[id] || comptes[id]!==mdp){

alert("Identifiant incorrect");

return;

}



if(verrou && id!=="administrateur"){

alert("🔧 Désolé, le site est en mise à jour. Contactez l'administrateur.");

return;

}



if(usersBloques.includes(id)){

alert("⛔ Ce compte est bloqué");

return;

}





document.getElementById("connexion").style.display="none";

document.getElementById("site").style.display="block";



document.getElementById("bienvenue").innerHTML =
id==="administrateur" ?
"👑 Bonjour admin !" :
"Bonjour "+id+" !";



if(id==="administrateur"){

document.getElementById("adminBtn").style.display="block";

}


chargerBlocages();


}







function jouer(b,url){


if(b.classList.contains("bloque")) return;


new Audio(url).play();


}







function ouvrirAdmin(){


let menu=document.getElementById("adminMenu");


menu.style.display =
menu.style.display==="block" ?
"none":"block";


}







function verrouSite(){


verrou=!verrou;


localStorage.setItem("verrou",verrou);


alert(verrou ?
"🔒 Site verrouillé":
"🔓 Site déverrouillé");


}






function bloquerSons(){


document.querySelectorAll(".son").forEach((b,i)=>{


b.classList.toggle("bloque");



if(b.classList.contains("bloque")){


if(!sonsBloques.includes(i))
sonsBloques.push(i);


}

else{


sonsBloques =
sonsBloques.filter(x=>x!==i);


}



});



localStorage.setItem(
"sonsBloques",
JSON.stringify(sonsBloques)
);



}







function gererUtilisateur(){


let nom=prompt(
"Nom du compte à bloquer/débloquer :"
);



if(!nom || nom==="administrateur"){

alert("Impossible");

return;

}



if(usersBloques.includes(nom)){


usersBloques =
usersBloques.filter(x=>x!==nom);



alert("✅ Utilisateur débloqué");


}

else{


usersBloques.push(nom);


alert("⛔ Utilisateur bloqué");


}



localStorage.setItem(
"usersBloques",
JSON.stringify(usersBloques)
);



}







function chargerBlocages(){


document.querySelectorAll(".son")
.forEach((b,i)=>{


if(sonsBloques.includes(i)){

b.classList.add("bloque");

}


});


}



</script>


</body>
</html>
