<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<title>Le Code Ness</title>

<style>
body{
    font-family:Arial,sans-serif;
    background-image:url("https://images.unsplash.com/photo-1506744038136-46273834b3fb");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;

h1{
    background:rgba(0,0,0,0.7);
    padding:20px;

    display:inline-block;
    margin-bottom:30px;
}

button{
    width:200px;
    height:200px;
    margin:10px;
    font-size:22px;
    font-weight:bold;
    border:none;
    border-radius:20px;
    cursor:pointer;
    transition:0.2s;
    background:white;
    color:black;
    display:inline-block;
    vertical-align:top;
}

button:hover{
    transform:scale(1.08);
}

.playing{
    background:limegreen;
    color:white;
}
</style>
</head>

<body>

<h1>🎵 Le Code Ness 🎵</h1>

<br>

<button onclick="jouer(this,'https://ztroeabflzrbxhxewsrc.supabase.co/storage/v1/object/public/sons/ca-va-peter.mp3')">
sa va peter
</button>

<button onclick="jouer(this,'https://ztroeabflzrbxhxewsrc.supabase.co/storage/v1/object/public/sons/couscous-merguez.mp3')">
coucous mergez
</button>

<button onclick="jouer(this,'https://ztroeabflzrbxhxewsrc.supabase.co/storage/v1/object/public/sons/quoi-de-neuf-dans-ton-troue.mp3')">
ton trou
</button>

<button onclick="jouer(this,'https://ztroeabflzrbxhxewsrc.supabase.co/storage/v1/object/public/sons/vos-meres-cest-des-dinosaures-tk78%20(1).mp3')">
vos mere les dinozaures
</button>

<button onclick="jouer(this,'https://ztroeabflzrbxhxewsrc.supabase.co/storage/v1/object/public/sons/detecteur-de-mensonges-des-enfants-_-louna-ccvb-4.mp3')">
arracher les yeux
</button>

<button onclick="jouer(this,'https://ztroeabflzrbxhxewsrc.supabase.co/storage/v1/object/public/sons/caca_c_d_licieux_.mp3')">
caca delicieux
</button>

<script>
let audioActuel = null;
let boutonActuel = null;

function jouer(bouton, url) {

    if (audioActuel) {
        audioActuel.pause();
        audioActuel.currentTime = 0;
    }

    if (boutonActuel) {
        boutonActuel.classList.remove("playing");
    }

    audioActuel = new Audio(url);
    boutonActuel = bouton;

    bouton.classList.add("playing");

    audioActuel.play();

    audioActuel.onended = () => {
        bouton.classList.remove("playing");
    };
}
</script>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Code Ness</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  height: 100vh;

  /* 🌄 beau fond paysage */
  background: url("https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1600&q=80") 
  no-repeat center center/cover;

  display: flex;
  align-items: center;
  justify-content: center;
}

/* filtre sombre pour lisibilité */
.overlay {
  position: absolute;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.45);
}

/* carte centrée */
.card {
  position: relative;
  z-index: 2;

  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(12px);

  padding: 40px;
  border-radius: 20px;

  width: 90%;
  max-width: 380px;

  color: white;
  text-align: center;

  box-shadow: 0 10px 30px rgba(0,0,0,0.5);

  /* 🎯 centrage parfait interne */
  display: flex;
  flex-direction: column;
  align-items: center;
}

h1 {
  margin-bottom: 10px;
}

/* inputs */
input {
  width: 100%;
  padding: 15px;
  margin: 10px 0;
  border: none;
  border-radius: 10px;
  font-size: 18px;
  outline: none;
}

/* bouton bien centré */
button {
  width: 100%;
  padding: 15px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;

  background: #00c6ff;
  color: white;
  font-size: 18px;

  cursor: pointer;

  display: block;
}

button:hover {
  background: #0099cc;
}

.info {
  font-size: 14px;
  opacity: 0.85;
  margin-top: 12px;
}
</style>

</head>

<body>

<div class="overlay"></div>

<div class="card">
  <h1>Code Ness</h1>
  <p>Authentification</p>

  <form onsubmit="login(event)">
    <input type="text" id="id" placeholder="Identifiant">
    <input type="password" id="mdp" placeholder="Mot de passe">
    <button type="submit">Se connecter</button>
  </form>

  <div class="info">
    Pour obtenir un compte, contactez l’administrateur Théo
  </div>
</div>

<script>
const users = {
  "adm": "Théoleroy2013*",
  "barbancon": "kaboom08" 
};

function login(event) {
  event.preventDefault();

  const id = document.getElementById("id").value;
  const mdp = document.getElementById("mdp").value;

  if (users[id] && users[id] === mdp) {
    alert("Connexion réussie !");
    window.location.href = "/";
  } else {
    alert("Accès refusé");
  }
}
</script>

</body>
</html>
