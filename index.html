<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Code Ness</title>

<style>
body{
font-family:Arial,sans-serif;
background:#111;
color:white;
text-align:center;
padding:40px;
}

button{
display:block;
width:300px;
margin:15px auto;
padding:20px;
font-size:22px;
border:none;
border-radius:12px;
cursor:pointer;
transition:0.2s;
}

button:hover{
transform:scale(1.05);
}

.playing{
background:limegreen;
color:white;
}
</style>
</head>

<body>

<h1>🎵 Le Code Ness</h1>

<button onclick="jouer(this,'https://ztroeabflzrbxhxewsrc.supabase.co/storage/v1/object/public/sons/ca-va-peter.mp3')">sa va peter</button>

<button onclick="jouer(this,'https://ztroeabflzrbxhxewsrc.supabase.co/storage/v1/object/public/sons/couscous-merguez.mp3')">coucous mergez</button>

<button onclick="jouer(this,'https://ztroeabflzrbxhxewsrc.supabase.co/storage/v1/object/public/sons/quoi-de-neuf-dans-ton-troue.mp3')">ton trou</button>

<button onclick="jouer(this,'https://ztroeabflzrbxhxewsrc.supabase.co/storage/v1/object/public/sons/vos-meres-cest-des-dinosaures-tk78%20(1).mp3')">vos mere les dinozaures</button>

<button onclick="jouer(this,'https://ztroeabflzrbxhxewsrc.supabase.co/storage/v1/object/public/sons/detecteur-de-mensonges-des-enfants-_-louna-ccvb-4.mp3')">arracher les yeux</button>

<button onclick="jouer(this,'https://ztroeabflzrbxhxewsrc.supabase.co/storage/v1/object/public/sons/caca_c_d_licieux_.mp3')">caca delicieux</button>

<script>
let audioActuel = null;
let boutonActuel = null;

function jouer(bouton, url) {

    if (audioActuel) {
        audioActuel.pause();
        audioActuel.currentTime = 0;
    }

    if (boutonActuel) {
        boutonActuel.classList.remove("playing");
    }

    audioActuel = new Audio(url);
    boutonActuel = bouton;

    bouton.classList.add("playing");

    audioActuel.play();

    audioActuel.onended = () => {
        bouton.classList.remove("playing");
    };
}
</script>

</body>
</html>
