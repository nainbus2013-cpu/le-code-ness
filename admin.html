<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  margin: 0;
  background: linear-gradient(135deg, #1e3c72, #2a5298);
  color: white;
}

/* HEADER */
.header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
  padding: 20px;
  background: rgba(0,0,0,0.3);
}

.logo {
  width: 50px;
  height: 50px;
  background: white;
  border-radius: 50%;
}

/* INFO BOX (FOND) */
.info {
  margin: 20px auto;
  width: 85%;
  max-width: 600px;
  background: rgba(0,0,0,0.4);
  padding: 20px;
  border-radius: 15px;
  font-size: 18px;
  line-height: 1.5;
}

/* FORM */
.container {
  margin-top: 30px;
}

input {
  width: 80%;
  max-width: 400px;
  font-size: 22px;
  padding: 15px;
  margin: 10px 0;
  border-radius: 10px;
  border: none;
}

button {
  width: 80%;
  max-width: 400px;
  font-size: 22px;
  padding: 15px;
  border-radius: 10px;
  border: none;
  background: #00c6ff;
  color: white;
}

button:hover {
  background: #0099cc;
}

/* FOOTER */
footer {
  position: fixed;
  bottom: 10px;
  width: 100%;
  font-size: 16px;
  opacity: 0.8;
}
</style>

</head>
<body>

<div class="header">
  <div class="logo"></div>
  <h2>Code Ness</h2>
</div>

<!-- INFORMATION -->
<div class="info">
  <h3>Information</h3>
  <p>
    Pour ceux qui veulent un compte dans ce site, il faut aller voir l’administrateur Théo.
  </p>
</div>

<div class="container">

<h1>Authentification</h1>

<form onsubmit="login(event)">
  <input type="text" id="id" placeholder="Identifiant"><br>

  <input type="password" id="mdp" placeholder="Mot de passe"><br>

  <button type="submit">Se connecter</button>
</form>

</div>

<footer>
  Théo et Carl
</footer>

<script>
const users = {
  "administrateur": "Théoleroy2013*",
  "admin2": "Test1234"
};

function login(event) {
  event.preventDefault();

  const id = document.getElementById("id").value;
  const mdp = document.getElementById("mdp").value;

  if (users[id] && users[id] === mdp) {
    alert("Connexion réussie !");
    window.location.href = "/";
  } else {
    alert("Accès refusé");
  }
}
</script>

</body>
</html>
