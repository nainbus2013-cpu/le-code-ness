<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin</title>
</head>
<body>

<h1>Connexion Admin</h1>

<form onsubmit="login(event)">
  <input type="text" id="id" placeholder="Identifiant"><br><br>

  <input type="password" id="mdp" placeholder="Mot de passe"><br><br>

  <button type="submit">Se connecter</button>
</form>

<script>
const users = {
  "administrateur": "Théoleroy2013*",
  "admin2": "Test1234"
};

function login(event) {
  event.preventDefault();

  const id = document.getElementById("id").value;
  const mdp = document.getElementById("mdp").value;

  if (users[id] && users[id] === mdp) {
    alert("Connexion réussie !");
    window.location.href = "/";
  } else {
    alert("Accès refusé");
  }
}
</script>

</body>
</html>
