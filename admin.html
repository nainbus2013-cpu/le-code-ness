<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Code Ness</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  height: 100vh;

  /* fond moderne */
  background: url("https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5") no-repeat center/cover;

  display: flex;
  align-items: center;
  justify-content: center;
}

/* flou derrière */
.overlay {
  position: absolute;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
}

/* carte login */
.card {
  position: relative;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
  padding: 40px;
  border-radius: 20px;
  width: 90%;
  max-width: 400px;
  color: white;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

h1 {
  margin-bottom: 20px;
}

/* inputs */
input {
  width: 100%;
  padding: 15px;
  margin: 10px 0;
  border: none;
  border-radius: 10px;
  font-size: 18px;
  outline: none;
}

/* bouton */
button {
  width: 100%;
  padding: 15px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;
  background: #00c6ff;
  color: white;
  font-size: 18px;
  cursor: pointer;
}

button:hover {
  background: #0099cc;
}

.info {
  font-size: 14px;
  opacity: 0.8;
  margin-top: 10px;
}
</style>

</head>

<body>

<div class="overlay"></div>

<div class="card">
  <h1>Code Ness</h1>
  <p>Authentification</p>

  <form onsubmit="login(event)">
    <input type="text" id="id" placeholder="Identifiant">
    <input type="password" id="mdp" placeholder="Mot de passe">
    <button type="submit">Se connecter</button>
  </form>

  <div class="info">
    Pour obtenir un compte, contactez l’administrateur Théo
  </div>
</div>

<script>
const users = {
  "administrateur": "Théoleroy2013*",
  "admin2": "Test1234"
};

function login(event) {
  event.preventDefault();

  const id = document.getElementById("id").value;
  const mdp = document.getElementById("mdp").value;

  if (users[id] && users[id] === mdp) {
    alert("Connexion réussie !");
    window.location.href = "/";
  } else {
    alert("Accès refusé");
  }
}
</script>

</body>
</html>
