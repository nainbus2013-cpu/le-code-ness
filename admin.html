<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  margin-top: 80px;
}

input {
  width: 80%;
  max-width: 400px;
  font-size: 22px;
  padding: 15px;
  margin: 10px 0;
  border-radius: 10px;
  border: 1px solid #ccc;
}

button {
  width: 80%;
  max-width: 400px;
  font-size: 22px;
  padding: 15px;
  border-radius: 10px;
  border: none;
  background: #007bff;
  color: white;
}
button:hover {
  background: #0056b3;
}
</style>

</head>
<body>

<h1>Connexion Admin</h1>

<form onsubmit="login(event)">
  <input type="text" id="id" placeholder="Identifiant"><br>

  <input type="password" id="mdp" placeholder="Mot de passe"><br>

  <button type="submit">Se connecter</button>
</form>

<script>
const users = {
  "administrateur": "Théoleroy2013*",
  "admin2": "Test1234"
};

function login(event) {
  event.preventDefault();

  const id = document.getElementById("id").value;
  const mdp = document.getElementById("mdp").value;

  if (users[id] && users[id] === mdp) {
    alert("Connexion réussie !");
    window.location.href = "/";
  } else {
    alert("Accès refusé");
  }
}
</script>

</body>
</html>
