<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Code Ness</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  height: 100vh;

  /* 🌄 beau fond paysage */
  background: url("https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1600&q=80") 
  no-repeat center center/cover;

  display: flex;
  align-items: center;
  justify-content: center;
}

/* filtre sombre pour lisibilité */
.overlay {
  position: absolute;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.45);
}

/* carte centrée */
.card {
  position: relative;
  z-index: 2;

  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(12px);

  padding: 40px;
  border-radius: 20px;

  width: 90%;
  max-width: 380px;

  color: white;
  text-align: center;

  box-shadow: 0 10px 30px rgba(0,0,0,0.5);

  /* 🎯 centrage parfait interne */
  display: flex;
  flex-direction: column;
  align-items: center;
}

h1 {
  margin-bottom: 10px;
}

/* inputs */
input {
  width: 100%;
  padding: 15px;
  margin: 10px 0;
  border: none;
  border-radius: 10px;
  font-size: 18px;
  outline: none;
}

/* bouton bien centré */
button {
  width: 100%;
  padding: 15px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;

  background: #00c6ff;
  color: white;
  font-size: 18px;

  cursor: pointer;

  display: block;
}

button:hover {
  background: #0099cc;
}

.info {
  font-size: 14px;
  opacity: 0.85;
  margin-top: 12px;
}
</style>

</head>

<body>

<div class="overlay"></div>

<div class="card">
  <h1>Code Ness</h1>
  <p>Authentification</p>

  <form onsubmit="login(event)">
    <input type="text" id="id" placeholder="Identifiant">
    <input type="password" id="mdp" placeholder="Mot de passe">
    <button type="submit">Se connecter</button>
  </form>

  <div class="info">
    Pour obtenir un compte, contactez l’administrateur Théo
  </div>
</div>

<script>
const users = {
  "adm": "Théoleroy2013*",
  "barbancon": "kaboom08" 
};

function login(event) {
  event.preventDefault();

  const id = document.getElementById("id").value;
  const mdp = document.getElementById("mdp").value;

  if (users[id] && users[id] === mdp) {
    alert("Connexion réussie !");
    window.location.href = "/";
  } else {
    alert("Accès refusé");
  }
}
</script>

</body>
</html>
