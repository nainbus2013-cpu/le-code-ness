<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Code Ness</title>

<style>
body {
  margin: 0;
  font-family: Arial;

  /* 💚 fond vert */
  background: #00b050;

  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* carte login */
.card {
  background: white;
  padding: 40px;
  border-radius: 20px;
  width: 90%;
  max-width: 400px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

input {
  width: 100%;
  padding: 15px;
  margin: 10px 0;
  font-size: 18px;
  border-radius: 10px;
  border: 1px solid #ccc;
}

button {
  width: 100%;
  padding: 15px;
  font-size: 18px;
  border-radius: 10px;
  border: none;
  background: #007bff;
  color: white;
}

button:hover {
  background: #0056b3;
}

.info {
  margin-top: 10px;
  font-size: 14px;
  color: gray;
}
</style>

</head>

<body>

<div class="card">
  <h1>Code Ness</h1>
  <p>Authentification</p>

  <form onsubmit="login(event)">
    <input type="text" id="id" placeholder="Identifiant">
    <input type="password" id="mdp" placeholder="Mot de passe">
    <button type="submit">Se connecter</button>
  </form>

  <div class="info">
    Pour obtenir un compte, contactez l’administrateur Théo
  </div>
</div>

<script>
const users = {
  "administrateur": "Théoleroy2013*",
  "admin2": "Test1234"
};

function login(event) {
  event.preventDefault();

  const id = document.getElementById("id").value;
  const mdp = document.getElementById("mdp").value;

  if (users[id] && users[id] === mdp) {
    alert("Connexion réussie !");
    window.location.href = "/";
  } else {
    alert("Accès refusé");
  }
}
</script>

</body>
</html>
