<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Code Ness</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  height: 100vh;
  overflow: hidden;
  background: #0f172a;
}

/* fond décoratif */
.bg {
  position: absolute;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

/* “boutons UI” décoratifs */
.btn-bg {
  position: absolute;
  padding: 10px 20px;
  border-radius: 10px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.2);
  color: white;
  font-size: 12px;
  backdrop-filter: blur(5px);
}

/* positions aléatoires */
.b1 { top: 10%; left: 5%; }
.b2 { top: 20%; left: 80%; }
.b3 { top: 70%; left: 10%; }
.b4 { top: 60%; left: 85%; }
.b5 { top: 40%; left: 50%; }
.b6 { top: 85%; left: 40%; }

/* login card */
.card {
  position: relative;
  z-index: 10;
  width: 90%;
  max-width: 400px;
  margin: auto;
  top: 50%;
  transform: translateY(-50%);

  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(12px);
  padding: 40px;
  border-radius: 20px;
  color: white;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

input {
  width: 100%;
  padding: 15px;
  margin: 10px 0;
  border-radius: 10px;
  border: none;
  font-size: 18px;
}

button {
  width: 100%;
  padding: 15px;
  border-radius: 10px;
  border: none;
  background: #00c6ff;
  color: white;
  font-size: 18px;
}
</style>

</head>

<body>

<div class="bg">
  <div class="btn-bg b1">Dashboard</div>
  <div class="btn-bg b2">Users</div>
  <div class="btn-bg b3">Settings</div>
  <div class="btn-bg b4">Logs</div>
  <div class="btn-bg b5">System</div>
  <div class="btn-bg b6">Admin</div>
</div>

<div class="card">
  <h1>Code Ness</h1>
  <p>Authentification</p>

  <form onsubmit="login(event)">
    <input type="text" id="id" placeholder="Identifiant">
    <input type="password" id="mdp" placeholder="Mot de passe">
    <button type="submit">Se connecter</button>
  </form>
</div>

<script>
const users = {
  "administrateur": "Théoleroy2013*",
  "admin2": "Test1234"
};

function login(event) {
  event.preventDefault();

  const id = document.getElementById("id").value;
  const mdp = document.getElementById("mdp").value;

  if (users[id] && users[id] === mdp) {
    alert("Connexion réussie !");
    window.location.href = "/";
  } else {
    alert("Accès refusé");
  }
}
</script>

</body>
</html>
